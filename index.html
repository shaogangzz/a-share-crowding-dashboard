<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股板块拥挤度看板 V5</title><style>body{margin:0;background:#08111f;color:#e7edf7;font:14px Arial,'Microsoft YaHei'}.wrap{max-width:1500px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap}.muted{color:#8fa0b8}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card,.panel{background:#101b2d;border:1px solid #24334d;border-radius:12px;padding:16px}.num{font-size:28px;font-weight:bold;margin-top:8px}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.panel{margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #22304a;text-align:left}th{color:#8fa0b8}.bar{height:9px;background:#24334d;border-radius:5px;overflow:hidden}.fill{height:100%;background:#4f8cff}.tag{padding:4px 8px;border-radius:8px;font-size:12px}.high{background:#4a1f2b;color:#ff9bab}.mid{background:#4b3a19;color:#ffd46b}.low{background:#163b2a;color:#8be3b0}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>A股板块拥挤度监控 V5</h1><div class="muted" id="meta">加载数据中…</div></div><div class="muted">五因子历史分位模型｜仅供研究参考</div></div><div class="grid" id="kpi"></div><div class="layout"><div><div class="panel"><h2>行业拥挤度排名</h2><div id="ranking"></div></div><div class="panel"><h2>完整行业数据</h2><table><thead><tr><th>行业</th><th>拥挤度</th><th>20日变化</th><th>风险</th><th>机会分</th></tr></thead><tbody id="rows"></tbody></table></div></div><div><div class="panel"><h2>今日结论</h2><p id="summary"></p></div><div class="panel"><h2>机会雷达</h2><div id="opp"></div></div><div class="panel"><h2>模型公式</h2><p>CI = 25% 动量 + 20% 成交 + 20% 换手 + 20% 资金流 + 15% 估值</p><p class="muted">各因子采用滚动历史分位数；缺失因子动态调整权重，不按0分处理。</p></div></div></div></div><script>fetch('data/latest.json?'+Date.now()).then(r=>r.json()).then(d=>{let x=d.industries||[];document.getElementById('meta').textContent='数据日期：'+d.date+' ｜ '+d.status;let avg=x.reduce((a,b)=>a+b.crowding,0)/(x.length||1),hot=x.filter(i=>i.crowding>=85).length,high=x.filter(i=>i.crowding>=70).length;document.getElementById('kpi').innerHTML=[['平均拥挤度',avg.toFixed(1)],['极度拥挤',hot],['高拥挤以上',high],['监控行业',x.length],['数据质量',d.data_quality||'--']].map(a=>'<div class=card><div class=muted>'+a[0]+'</div><div class=num>'+a[1]+'</div></div>').join('');let s=[...x].sort((a,b)=>b.crowding-a.crowding);document.getElementById('ranking').innerHTML=s.map(i=>'<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>'+i.name+'</b><span>'+i.crowding.toFixed(1)+'</span></div><div class=bar><div class=fill style="width:'+i.crowding+'%"></div></div></div>').join('');document.getElementById('rows').innerHTML=s.map(i=>'<tr><td>'+i.name+'</td><td>'+i.crowding.toFixed(1)+'</td><td>'+(i.change20||0).toFixed(1)+'</td><td><span class="tag '+(i.crowding>=85?'high':i.crowding>=70?'mid':'low')+'">'+i.risk+'</span></td><td>'+i.opportunity.toFixed(1)+'</td></tr>').join('');document.getElementById('opp').innerHTML=[...x].sort((a,b)=>b.opportunity-a.opportunity).slice(0,8).map(i=>'<p><b>'+i.name+'</b>　机会 '+i.opportunity.toFixed(1)+'　拥挤 '+i.crowding.toFixed(1)+'</p>').join('');document.getElementById('summary').textContent=d.summary||'暂无结论';}).catch(e=>document.getElementById('meta').textContent='数据暂时不可用，等待下一次云端更新');</script></body></html>

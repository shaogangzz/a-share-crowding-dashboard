<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股板块拥挤度监控 V6</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2c;--panel2:#101f34;--line:#203552;--text:#edf4ff;--muted:#8193ad;--blue:#4f8cff;--cyan:#35d4c8;--red:#ff6378;--yellow:#ffbd59}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#142746 0,transparent 28%),var(--bg);color:var(--text);font:14px Inter,Arial,"Microsoft YaHei",sans-serif}
.wrap{max-width:1600px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:2px}.hero h1{margin:7px 0;font-size:32px}.muted{color:var(--muted)}.status{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#0b1728}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:linear-gradient(145deg,rgba(18,35,57,.95),rgba(10,22,39,.96));border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.14)}.card{padding:16px}.num{font-size:29px;font-weight:700;margin-top:8px}.panel{padding:20px;margin-top:14px}.main-grid{display:grid;grid-template-columns:1fr 340px;gap:14px}.chart-top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls select,.controls input,.btn{background:#0a1526;border:1px solid #29425f;color:var(--text);border-radius:9px;padding:8px 10px}.btn{cursor:pointer}.btn.active{background:var(--blue);border-color:var(--blue)}#chart{width:100%;height:390px;margin-top:18px;background:linear-gradient(180deg,rgba(79,140,255,.06),transparent);border-radius:12px}.range{display:flex;gap:8px;align-items:center;color:var(--muted);margin-top:12px}.range input{min-width:135px}
.list{max-height:500px;overflow:auto}.row{padding:12px 0;border-bottom:1px solid rgba(42,61,88,.7)}.row:last-child{border:0}.rhead{display:flex;justify-content:space-between}.bar{height:7px;background:#1b2b43;border-radius:9px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 10px;border-bottom:1px solid rgba(42,61,88,.7);text-align:left}th{color:var(--muted);font-weight:500}.tag{padding:4px 8px;border-radius:7px;font-size:12px}.high{background:rgba(255,99,120,.16);color:#ff9cac}.mid{background:rgba(255,189,89,.15);color:#ffd183}.low{background:rgba(53,212,200,.12);color:#75e8dc}
.note{font-size:12px;color:var(--muted);line-height:1.7}.legend{display:flex;gap:16px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--blue);margin-right:5px}.dot.c{background:var(--cyan)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}.hero{align-items:flex-start;gap:10px}.hero h1{font-size:25px}}@media(max-width:600px){.wrap{padding:14px}.kpis{grid-template-columns:1fr 1fr}.range{flex-wrap:wrap}#chart{height:300px}}
</style></head><body><div class="wrap">
<div class="hero"><div><div class="eyebrow">A-SHARE MARKET INTELLIGENCE</div><h1>A股板块拥挤度监控 <span style="color:#4f8cff">V6</span></h1><div class="muted" id="meta">正在加载云端数据…</div></div><div class="status" id="quality">--</div></div>
<div class="kpis" id="kpis"></div>
<div class="main-grid">
 <div><div class="panel"><div class="chart-top"><div><h2 style="margin:0 0 5px">行业历史拥挤度走势</h2><div class="muted">选择任意行业，自由调整横轴时间区间</div></div><div class="controls"><select id="industry"></select><button class="btn active" data-days="30">1月</button><button class="btn" data-days="90">3月</button><button class="btn" data-days="180">6月</button><button class="btn" data-days="365">1年</button><button class="btn" data-days="9999">全部</button></div></div>
 <div class="range"><span>时间：</span><input type="date" id="start"><span>至</span><input type="date" id="end"></div>
 <svg id="chart" viewBox="0 0 1000 390" preserveAspectRatio="none"></svg><div class="legend"><span><i class="dot"></i>拥挤度 CI</span><span><i class="dot c"></i>收盘指数（归一化）</span></div></div>
 <div class="panel"><h2 style="margin-top:0">完整行业数据</h2><div class="tablewrap"><table><thead><tr><th>行业</th><th>拥挤度</th><th>20日变化</th><th>风险</th><th>机会分</th><th>查看</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
 <aside><div class="panel"><h2 style="margin-top:0">今日结论</h2><p id="summary" style="line-height:1.8"></p></div><div class="panel"><h2 style="margin-top:0">拥挤度排名</h2><div class="list" id="ranking"></div></div><div class="panel"><h2 style="margin-top:0">模型</h2><div class="note">CI = 25% 动量 + 20% 成交 + 20% 换手 + 20% 资金趋势 + 15% 估值。<br><br>历史图表初始化采用东方财富行业日K重建，历史估值数据缺失部分按中性值处理；实时最新点使用完整五因子模型。</div></div></aside>
</div></div>
<script>
const $=s=>document.querySelector(s);let latest,series=[],selected="",days=30;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function tag(i){return i.crowding>=70?"high":i.crowding>=55?"mid":"low"}
function renderChart(){
 let a=series.filter(x=>x.name===selected).sort((x,y)=>x.date.localeCompare(y.date));
 const st=$("#start").value,en=$("#end").value;if(st)a=a.filter(x=>x.date>=st);if(en)a=a.filter(x=>x.date<=en);
 const svg=$("#chart"),W=1000,H=390,L=58,R=25,T=22,B=42;svg.innerHTML="";
 if(a.length<2){svg.innerHTML='<text x="500" y="190" text-anchor="middle" fill="#8193ad" font-size="16">历史数据正在初始化，下一次云端更新后会继续补充</text>';return}
 let minD=a[0].date,maxD=a[a.length-1].date, n=a.length, close=a.map(x=>+x.close||0), cmin=Math.min(...close),cmax=Math.max(...close);if(cmax===cmin)cmax=cmin+1;
 const x=i=>L+(W-L-R)*(i/(n-1)), y=v=>T+(H-T-B)*(1-v/100), yc=v=>T+(H-T-B)*(1-(v-cmin)/(cmax-cmin));
 for(let k=0;k<=4;k++){let v=k*25,yy=y(v);svg.innerHTML+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#203552" stroke-width="1"/><text x="14" y="${yy+4}" fill="#8193ad" font-size="12">${v}</text>`}
 let path=a.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(+d.crowding).toFixed(1)).join(" ");let cp=a.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+","+yc(+d.close||0).toFixed(1)).join(" ");
 svg.innerHTML+=`<path d="${path}" fill="none" stroke="#4f8cff" stroke-width="3"/><path d="${cp}" fill="none" stroke="#35d4c8" stroke-width="2" opacity=".75"/>`;
 let ticks=Math.min(6,n);for(let k=0;k<ticks;k++){let i=Math.round(k*(n-1)/(ticks-1||1));svg.innerHTML+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" fill="#8193ad" font-size="11">${a[i].date.slice(5)}</text>`}
}
function setPeriod(d){
 days=d;document.querySelectorAll("[data-days]").forEach(b=>b.classList.toggle("active",+b.dataset.days===d));
 let a=series.filter(x=>x.name===selected).sort((x,y)=>x.date.localeCompare(y.date));if(!a.length)return;
 $("#end").value=a[a.length-1].date;let end=new Date(a[a.length-1].date),start=new Date(end);start.setDate(end.getDate()-d);$("#start").value=d>=9000?a[0].date:start.toISOString().slice(0,10);renderChart()
}
Promise.all([fetch("data/latest.json?"+Date.now()).then(r=>r.json()),fetch("data/timeseries.json?"+Date.now()).then(r=>r.json()).catch(()=>[])])
.then(([d,s])=>{latest=d;series=s||[];let x=d.industries||[],avg=x.reduce((a,b)=>a+b.crowding,0)/(x.length||1),hot=x.filter(i=>i.crowding>=85).length,high=x.filter(i=>i.crowding>=70).length;
 $("#meta").textContent="数据日期："+d.date+" ｜ "+d.status+" ｜ 历史图表点："+(d.history_points||series.length);$("#quality").textContent=d.data_quality||"--";
 $("#kpis").innerHTML=[["平均拥挤度",avg.toFixed(1)],["极度拥挤",hot],["高拥挤以上",high],["监控行业",x.length],["历史数据点",d.history_points||series.length]].map(v=>'<div class="card"><div class="muted">'+v[0]+'</div><div class="num">'+v[1]+'</div></div>').join("");
 let sorted=[...x].sort((a,b)=>b.crowding-a.crowding);$("#summary").textContent=d.summary||"暂无结论";
 $("#ranking").innerHTML=sorted.slice(0,20).map(i=>'<div class="row"><div class="rhead"><b>'+esc(i.name)+'</b><span>'+i.crowding.toFixed(1)+'</span></div><div class="bar"><div class="fill" style="width:'+i.crowding+'%"></div></div></div>').join("");
 $("#rows").innerHTML=sorted.map(i=>'<tr><td><b>'+esc(i.name)+'</b></td><td>'+i.crowding.toFixed(1)+'</td><td>'+(i.change20||0).toFixed(1)+'%</td><td><span class="tag '+tag(i)+'">'+esc(i.risk)+'</span></td><td>'+i.opportunity.toFixed(1)+'</td><td><button class="btn view" data-name="'+esc(i.name)+'">走势</button></td></tr>').join("");
 let names=[...new Set([...x.map(i=>i.name),...series.map(i=>i.name)])].sort();$("#industry").innerHTML=names.map(n=>'<option>'+esc(n)+'</option>').join("");selected=names.includes(sorted[0]?.name)?sorted[0].name:names[0];
 $("#industry").value=selected;setPeriod(30);
 $("#industry").onchange=e=>{selected=e.target.value;setPeriod(days)};document.querySelectorAll("[data-days]").forEach(b=>b.onclick=()=>setPeriod(+b.dataset.days));$("#start").onchange=renderChart;$("#end").onchange=renderChart;
 document.querySelectorAll(".view").forEach(b=>b.onclick=()=>{selected=b.dataset.name;$("#industry").value=selected;setPeriod(days);window.scrollTo({top:0,behavior:"smooth"})});
}).catch(e=>{$("#meta").textContent="数据加载失败："+e.message});
</script></body></html>
